<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:var(--w);height:var(--h);font-family:Inter,sans-serif;overflow:hidden}
.ad{width:100%;height:100%;background:radial-gradient(circle at 85% 10%,#1f3d33 0,#0d1714 55%);color:#fff;position:relative;display:flex;flex-direction:column;padding:var(--pad)}
.brand{display:flex;align-items:center;gap:14px}
.logo{position:relative;width:48px;height:70px}
.logo .j{font-family:Poppins;font-weight:700;font-size:64px;line-height:1;position:absolute;left:14px;top:-2px;color:#fff;clip-path:inset(30% 0 0 0)}
.dots{position:absolute;top:6px;left:2px;display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.brand span{font-family:Poppins;font-weight:600;font-size:26px;letter-spacing:.5px;opacity:.9}
h1{font-family:Poppins;font-weight:700;font-size:var(--h1);line-height:1.08;margin-top:var(--gap1);letter-spacing:-1px}
h1 em{font-style:normal;color:#25D366}
.sub{font-size:var(--sub);opacity:.82;margin-top:18px;line-height:1.35;max-width:var(--subw)}
.phone{background:#0b141a;border-radius:34px;border:6px solid #2a3b35;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;font-size:var(--chat)}
.top{background:#1f2c34;padding:16px 20px;display:flex;align-items:center;gap:14px}
.av{width:44px;height:44px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0b141a;font-size:20px}
.top b{display:block;font-size:1.05em}.top small{color:#8fd9a8;font-size:.8em}
.chat{padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:#0b141a}
.m{max-width:82%;padding:10px 14px;border-radius:14px;line-height:1.35}
.in{background:#202c33;align-self:flex-start;border-top-left-radius:4px}
.out{background:#005c4b;align-self:flex-end;border-top-right-radius:4px}
.m .t{display:block;text-align:right;font-size:.7em;opacity:.55;margin-top:3px}
.list{margin-top:4px}.list div{display:flex;justify-content:space-between;gap:18px}
.btn{display:inline-block;margin-top:8px;background:#25D366;color:#0b141a;font-weight:700;padding:6px 14px;border-radius:20px;font-size:.9em}
.cta{display:inline-flex;align-items:center;gap:12px;background:#25D366;color:#0b141a;font-weight:800;font-size:var(--cta);padding:18px 34px;border-radius:60px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pills span{border:1.5px solid rgba(255,255,255,.25);padding:9px 18px;border-radius:40px;font-size:var(--pill);font-weight:500}
.foot{display:flex;justify-content:space-between;align-items:center}
.url{font-size:22px;opacity:.7;font-weight:600}
</style></head>
<body><div class="ad">
<div class="brand"><div class="logo"><div class="dots"><i style="background:#4285F4"></i><i style="background:#EA4335"></i><i style="background:#FBBC05"></i><i style="background:#34A853"></i></div><div class="j">j</div></div><span>JIMOHNE</span></div>
<!--CONTENT-->
</div></body></html>
